<div class="Recipe"><div class="RecipeTitle">Chocolate Sheet Cake</div><br/><br/><br/><br/>1 cup sugar<br/>1/4 cup soft butter<br/>1 egg<br/>1 teaspoon baking powder<br/>1 teaspoon baking soda<br/>1 1/4 cups flour<br/>1/4 c cocoa powder<br/>1 cup boiling water<br/><br/><br/>Mix dry stuff, add egg and butter until crumbly. Stir in boiling water. Pour into small pan (9x9) and bake at 350f for 30 minutes.<br/><br/></div></body>
